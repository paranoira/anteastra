name: Build AnteAstra

on:
  # Normal verification covers stable pushes, PRs targeting stable and manual runs.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Forráskód letöltése
        uses: actions/checkout@v6

      - name: Node.js beállítása
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Függőségek telepítése
        run: npm ci

      - name: Astro build
        run: npm run build

      - name: Kész weboldal elmentése
        # This is also the source for the documented manual fallback deployment.
        uses: actions/upload-artifact@v7
        with:
          name: anteastra-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
